<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><link rel="manifest" href="/manifest.webmanifest"><title>IRENX Gateway</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:20px}.card{background:#0c0c0c;border:1px solid #222;border-radius:16px;padding:18px;margin:14px 0}textarea{width:100%;min-height:130px;background:#080808;color:#eee;border:1px solid #333;border-radius:10px;padding:12px;box-sizing:border-box}button{margin-top:10px;padding:11px 16px;border:1px solid #333;border-radius:10px;background:#151515;color:#fff}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#6ee7a1}.muted{color:#888}.warn{color:#fbbf24}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main class="app"><h1>IRENX <span class="ok">GATEWAY</span></h1><p class="muted">Zero-config AI gateway · OpenAI-compatible · Android ready</p><section class="card"><b>AI CHAT</b><textarea id="p" placeholder="Tulis pertanyaan...">Analisis XAUUSD secara umum dan jelaskan faktor yang perlu dikonfirmasi sebelum entry.</textarea><div id="challenge"></div><button id="go">RUN IRENX</button><pre id="out">Ready.</pre></section><section class="card"><b>PRODUCTION STATUS</b><pre id="health">Checking...</pre></section></main><script>const $=id=>document.getElementById(id);let turnstileToken='';async function config(){try{const c=await (await fetch('/api/config')).json();if(c.turnstile_required&&c.turnstile_sitekey){$('challenge').className='cf-turnstile';$('challenge').dataset.sitekey=c.turnstile_sitekey;$('challenge').dataset.callback='onTurnstile';if(window.turnstile)window.turnstile.render($('challenge'),{sitekey:c.turnstile_sitekey,callback:onTurnstile,theme:'dark'});else setTimeout(config,500)}}catch(e){}}window.onTurnstile=t=>{turnstileToken=t};async function health(){try{$('health').textContent=JSON.stringify(await (await fetch('/api/health')).json(),null,2)}catch(e){$('health').textContent='offline'}}$('go').onclick=async()=>{const b=$('go');b.disabled=true;$('out').textContent='Thinking...';try{const h={'content-type':'application/json'};if(turnstileToken)h['cf-turnstile-response']=turnstileToken;const r=await fetch('/v1/responses',{method:'POST',headers:h,body:JSON.stringify({model:'irenx-auto',input:$('p').value})});const j=await r.json();$('out').textContent=j.output_text||j.output?.map(x=>x.content?.map(c=>c.text).join('')).join('')||JSON.stringify(j,null,2);if(window.turnstile&&turnstileToken){window.turnstile.reset();turnstileToken=''}}catch(e){$('out').textContent=String(e)}finally{b.disabled=false}};config();health();setInterval(health,30000)</script></body></html>
