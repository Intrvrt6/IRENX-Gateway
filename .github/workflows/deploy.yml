name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: irenx-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GATEWAY_URL: https://gateway.irenx.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker + Custom Domain
        run: npx wrangler deploy

      - name: Wait for production health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "Health attempt $i/30"
            if curl --fail --silent --show-error --max-time 10 "$GATEWAY_URL/api/health" -o /tmp/health.json; then
              node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(x.ok!==true) process.exit(1); console.log(x)'
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed"
          exit 1

      - name: Smoke test /v1/models
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "Smoke attempt $i/30"
            if curl --fail --silent --show-error --max-time 10 "$GATEWAY_URL/v1/models" -o /tmp/models.json; then
              node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/models.json","utf8")); if(x.object!=="list" || !Array.isArray(x.data) || !x.data.some(m=>m.id==="irenx-auto")) process.exit(1); console.log(x)'
              exit 0
            fi
            sleep 10
          done
          echo "API smoke test failed"
          exit 1

      - name: Roll back failed deployment
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Smoke test failed; rolling back the latest Worker deployment."
          npx wrangler rollback --name irenx-gateway --message "Automated rollback: production smoke test failed"

      - name: Production summary
        if: success()
        run: |
          echo "IRENX Gateway production deployment verified."
          echo "Health: $GATEWAY_URL/api/health"
          echo "Models: $GATEWAY_URL/v1/models"
