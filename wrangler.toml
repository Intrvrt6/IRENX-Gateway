name = "irenx-gateway"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"

[vars]
OPENAI_MODEL = "gpt-5.6"
OPENAI_SEARCH_CONTEXT = "medium"
OMNIROUTE_BASE_URL = ""
TURNSTILE_SITEKEY = ""
ENFORCE_TURNSTILE = "false"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
